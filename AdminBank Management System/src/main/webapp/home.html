<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Background Gradient */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
}

/* Card Container */
.container {
    background: #fff;
    padding: 30px;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
}

/* Heading */
.container h1 {
    margin-bottom: 20px;
    color: #333;
}

/* Input Fields */
.input-group {
    text-align: left;
    margin-bottom: 15px;
}

.input-group label {
    font-size: 14px;
    color: #555;
}

.input-group input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

/* Input Focus Effect */
.input-group input:focus {
    border-color: #4facfe;
    outline: none;
    box-shadow: 0 0 5px rgba(79,172,254,0.5);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #4facfe, #00c6ff);
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

/* Button Hover */
button:hover {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    transform: scale(1.03);
}

/* Footer Text */
.footer {
    margin-top: 15px;
    font-size: 13px;
    color: #777;
}

.footer a {
    color: #0072ff;
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="container">
    <h1>Admin Login</h1>

    <form action="als" method="get">

        <div class="input-group">
            <label>Admin Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
        </div>

        <div class="input-group">
            <label>Admin Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" name="action">Login</button>
    </form>

    <div class="footer">
        © 2026 Admin Panel
    </div>
</div>

</body>
</html>
