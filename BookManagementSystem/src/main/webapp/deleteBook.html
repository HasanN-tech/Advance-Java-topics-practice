<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Delete Book</title>
<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
    text-align: center;
}
form {
    background-color: white;
    padding: 20px;
    margin: 20px auto;
    width: 300px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
input {
    width: 90%;
    padding: 8px;
    margin: 5px;
}
button {
    padding: 10px;
    width: 100%;
    background-color: red;
    color: white;
    border: none;
}
button:hover {
    background-color: darkred;
}
</style>
</head>
<body>
<h1>Delete Book</h1>

<form action="deleteBook" method="get">
<input type="text" name="bookId" placeholder="Book Id" required> <br>
<button type="submit"> Delete</button>
</form>
</body>
</html>
