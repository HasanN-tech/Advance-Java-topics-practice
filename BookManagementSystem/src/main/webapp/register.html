<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Register</title>

<style>
body {
    font-family: Arial;
    background-color: #f4f6f8;
    text-align: center;
}

h1 {
    color: #333;
}

form {
    background: white;
    padding: 20px;
    width: 300px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

input[type="text"],
input[type="password"],
input[type="number"] {
    width: 90%;
    padding: 8px;
    margin-top: 5px;
}

input[type="submit"] {
    background-color: #007bff;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background-color: #0056b3;
}
</style>

</head>

<body>

<h1>Admin Register Form</h1>

<form action="reg" method="get">

    Admin First Name:<br>
    <input type="text" name="fname"><br><br>

    Admin Last Name:<br>
    <input type="text" name="lname"><br><br>
    
     Admin Full Name:<br>
    <input type="text" name="name"><br><br>

    Admin Password:<br>
    <input type="password" name="pass"><br><br>

    Admin Mail Id:<br>
    <input type="text" name="mailId"><br><br>

    Admin PhNo:<br>
    <input type="number" name="phNo"><br><br>

    <input type="submit" value="SUBMIT">

</form>

</body>
</html>
