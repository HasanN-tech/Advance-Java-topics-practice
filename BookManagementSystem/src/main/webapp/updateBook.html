<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Book</title>
<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
    text-align: center;
}
form {
    background-color: white;
    padding: 20px;
    margin: 20px auto;
    width: 300px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
input {
    width: 90%;
    padding: 8px;
    margin: 5px;
}
button {
    padding: 10px;
    width: 100%;
    background-color: orange;
    color: white;
    border: none;
}
button:hover {
    background-color: darkorange;
}
</style>
</head>
<body>
<h1>Update Book</h1>
<form action="updateBook" method="get">
<input type="text" name="id" placeholder="Book ID" required><br>
    <input type="text" name="name" placeholder="New Name"><br>
    <input type="text" name="author" placeholder="New Author"><br>
    <input type="text" name="price" placeholder="New Price"><br>
    <input type="text" name="quantity" placeholder="New Quantity"><br>
    <button type="submit" name="action">Update Book</button>
</form>
</body>
</html>
