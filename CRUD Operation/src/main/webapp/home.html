<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
body div {
    text-align: center;
}

/* Links as buttons */
a {
    display: block;
    width: 200px;
    margin: 15px;
    padding: 12px;
    text-decoration: none;
    color: white;
    background-color: #4CAF50;
    border-radius: 8px;
    font-size: 18px;
    transition: 0.3s;
}

/* Hover effect */
a:hover {
    background-color: #45a049;
    transform: scale(1.05);
}
</style>

</head>

<body>

<div>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
</div>

</body>
</html>
