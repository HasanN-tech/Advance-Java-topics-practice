<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Register</title>

<style>
body {
    font-family: Arial;
    background-color: #f4f6f8;
    text-align: center;
}

h1 {
    color: #333;
}

form {
    background: white;
    padding: 20px;
    width: 300px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

input[type="text"],
input[type="password"],
input[type="number"] {
    width: 90%;
    padding: 8px;
    margin-top: 5px;
}

input[type="submit"] {
    background-color: #007bff;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background-color: #0056b3;
}
</style>

</head>

<body>

<h1>Register Form</h1>

<form action="RegisterServlet" method="get">
    
     ID:<br>
    <input type="number" name="id"><br><br>
    
     Full Name:<br>
    <input type="text" name="name"><br><br>
    
    Mail Id:<br>
    <input type="text" name="email"><br><br>
    
    Password:<br>
    <input type="password" name="password"><br><br>

    <input type="submit" value="SUBMIT">

</form>

</body>
</html>
