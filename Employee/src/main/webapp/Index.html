<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Details</title>
<style type="text/css">
body {
    font-family: Arial;
}

.container {
    width: 600px;
    padding: 20px;
    background: cyan;
    color: black;
}
input, select {
    margin: 5px;
    padding: 5px;
}

</style>
</head>
<body>
<h1>Enter Employee Details</h1>
<form action="emp" method="get"> <br><br>

<div class="container">
Employee Name <input type="text" name="name"> <br><br>
Employee Age <input type="number" name="age"> <br><br>
Employee Salary <input type="number" name="salary"> <br><br>
Employee MailId <input type="text" name="mailId"> <br><br>

Select Employee Gender: 
<input type="radio" name="gender" checked="checked">Male
<input type="radio" name="gender"> Female <br><br>

Select Employee Hobbies:
<input type="checkbox" name="hobbies" checked="checked"> Playing
<input type="checkbox" name="hobbies" > Reading
<input type="checkbox" name="hobbies" > Searching
<input type="checkbox" name="hobbies" > Sleeping <br><br>

Select Employee State:
<select name="state">
<option >UP</option>
<option >Delhi</option>
<option >Telengana</option> 
</select><br><br>

<input type="submit" name="action" value="SUBMIT">

</div>
</form>
</body>
</html>
