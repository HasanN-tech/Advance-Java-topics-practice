<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #74ebd5, #9face6);
    text-align: center;
    margin-top: 100px;
}

h1 {
    color: #333;
}

form {
    background-color: white;
    width: 300px;
    margin: auto;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
}

input[type="text"],
input[type="password"] {
    width: 90%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input[type="submit"] {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

input[type="submit"]:hover {
    background-color: #45a049;
}
</style>

</head>

<body>

<h1>Admin Login</h1>

<form action="log" method="get">

    Admin Name:<br>
    <input type="text" name="logName"><br><br>

    Admin Password:<br>
    <input type="password" name="logPass"><br><br>

    <input type="submit" name="action" value="LOGIN">

</form>

</body>
</html>
