<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Book</title>
<style>
body {
    font-family: Arial;
    background-color: #f2f2f2;
    text-align: center;
}
form {
    background-color: white;
    padding: 20px;
    margin: 20px auto;
    width: 300px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
input {
    width: 90%;
    padding: 8px;
    margin: 5px;
}
button {
    padding: 10px;
    width: 100%;
    background-color: orange;
    color: white;
    border: none;
}
button:hover {
    background-color: darkorange;
}
</style>
</head>
<body>
<h1>Update</h1>
<form action="update" method="get">
	<input type="text" name="id" placeholder="Product id" required><br>
<input type="text" name="name" placeholder="Product Name" required><br>
<input type="text" name="qty" placeholder="Quantity"> <br>
<input type="text" name="status" placeholder="Status"> <br>
<button type="submit" name="action">Update</button>
</form>
</body>
</html>
